[package]
name = "molwasm"
version = "0.1.0"
edition = "2024"
authors = ["MolCrafts"]
description = "WASM bindings for molcore (Box + XYZ parser)"
license = "BSD-3-Clause"
repository = "https://github.com/MolCrafts/molcore"

[lib]
crate-type = ["cdylib", "rlib"]
name = "molwasm"

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
molcore = { path = ".." }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
# Optimize for smaller .wasm in release builds
lto = true
opt-level = "z"
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
